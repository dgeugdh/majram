<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت إنشاء حسابات انستجرام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h3><i class="fab fa-instagram"></i> بوت انستجرام</h3>
                    <p>إنشاء حسابات انستجرام تلقائياً</p>
                </div>
                
                <div class="sidebar-content">
                    <div class="form-group mb-3">
                        <label for="numAccounts">عدد الحسابات:</label>
                        <input type="number" id="numAccounts" class="form-control" value="1" min="1" max="10">
                    </div>
                    
                    <button id="startBot" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-play"></i> بدء البوت
                    </button>
                    
                    <button id="stopBot" class="btn btn-danger btn-lg w-100 mb-3" style="display: none;">
                        <i class="fas fa-stop"></i> إيقاف البوت
                    </button>
                    
                    <div class="status-card">
                        <h5><i class="fas fa-info-circle"></i> حالة البوت</h5>
                        <div id="botStatus">جاهز</div>
                        <div id="progressBar" class="progress mt-2" style="display: none;">
                            <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 main-content">
                <div class="row">
                    <!-- Statistics Cards -->
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <div class="stat-content">
                                <h3 id="accountsCreated">0</h3>
                                <p>الحسابات المُنشأة</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-chart-line"></i>
                            </div>
                            <div class="stat-content">
                                <h3 id="successRate">0%</h3>
                                <p>معدل النجاح</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="stat-content">
                                <h3 id="totalTime">00:00</h3>
                                <p>الوقت المستغرق</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Logs Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="logs-card">
                            <div class="logs-header">
                                <h5><i class="fas fa-terminal"></i> سجل العمليات</h5>
                                <button id="clearLogs" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-trash"></i> مسح السجل
                                </button>
                            </div>
                            <div id="logsContainer" class="logs-container">
                                <div class="log-entry">
                                    <span class="log-time">[00:00:00]</span>
                                    <span class="log-message">جاهز لبدء إنشاء الحسابات...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Results Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="results-card">
                            <div class="results-header">
                                <h5><i class="fas fa-list"></i> الحسابات المُنشأة</h5>
                                <button id="exportResults" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-download"></i> تصدير النتائج
                                </button>
                            </div>
                            <div id="resultsContainer" class="results-container">
                                <div class="no-results">
                                    <i class="fas fa-inbox"></i>
                                    <p>لا توجد نتائج بعد</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">جاري التحميل...</span>
                    </div>
                    <h5 class="mt-3">جاري إنشاء الحسابات...</h5>
                    <p>يرجى الانتظار، قد يستغرق هذا بضع دقائق</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
