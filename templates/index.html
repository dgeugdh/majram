<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت إنشاء حسابات انستقرام</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h3><i class="fab fa-instagram"></i> بوت انستقرام</h3>
                    <p>إنشاء حسابات انستقرام تلقائياً</p>
                </div>
                
                <div class="sidebar-content">
                    <div class="form-group mb-3">
                        <label for="numAccounts">عدد الحسابات:</label>
                        <input type="number" id="numAccounts" class="form-control" value="1" min="1" max="10">
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="delayBetween">التأخير بين الحسابات (ثواني):</label>
                        <input type="number" id="delayBetween" class="form-control" value="5" min="1" max="30">
                    </div>
                    
                    <button id="startBot" class="btn btn-primary btn-lg w-100 mb-3">
                        <i class="fas fa-play"></i> بدء البوت
                    </button>
                    
                    <button id="stopBot" class="btn btn-danger btn-lg w-100 mb-3" style="display: none;">
                        <i class="fas fa-stop"></i> إيقاف البوت
                    </button>
                    
                    <div class="status-card">
                        <h5>حالة البوت</h5>
                        <div id="botStatus" class="status-indicator">
                            <span class="status-dot idle"></span>
                            <span class="status-text">جاهز</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-9 main-content">
                <div class="row">
                    <!-- Progress Section -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-chart-line"></i> التقدم</h5>
                            </div>
                            <div class="card-body">
                                <div class="progress-container">
                                    <div class="progress">
                                        <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                                    </div>
                                    <div class="progress-text">
                                        <span id="progressText">0%</span>
                                        <span id="accountsCreated">0 / 0</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Statistics Section -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-chart-bar"></i> الإحصائيات</h5>
                            </div>
                            <div class="card-body">
                                <div class="stats-grid">
                                    <div class="stat-item">
                                        <div class="stat-number" id="totalAccounts">0</div>
                                        <div class="stat-label">إجمالي الحسابات</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-number" id="successfulAccounts">0</div>
                                        <div class="stat-label">الحسابات الناجحة</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-number" id="successRate">0%</div>
                                        <div class="stat-label">معدل النجاح</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Logs Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5><i class="fas fa-terminal"></i> سجل العمليات</h5>
                                <button id="clearLogs" class="btn btn-sm btn-outline-secondary">
                                    <i class="fas fa-trash"></i> مسح السجل
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="logsContainer" class="logs-container">
                                    <div class="log-entry">
                                        <span class="log-time">[00:00:00]</span>
                                        <span class="log-message">جاهز لبدء إنشاء الحسابات...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Results Section -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5><i class="fas fa-list"></i> الحسابات المُنشأة</h5>
                            </div>
                            <div class="card-body">
                                <div id="resultsContainer" class="results-container">
                                    <div class="no-results">
                                        <i class="fas fa-info-circle"></i>
                                        <p>لم يتم إنشاء أي حسابات بعد</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">جاري التحميل...</span>
                    </div>
                    <p class="mt-3">جاري إنشاء الحسابات...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
